<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AJG Blocks — Downloads</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #191b1e;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 32px;
  }
  .logo-mark {
    width: 44px;
    height: 44px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 3px;
  }
  .logo-mark span { background: #e2231a; border-radius: 3px; }
  .logo-mark span:nth-child(2) { background: #ff5a50; }
  .logo-mark span:nth-child(3) { background: #ff5a50; }
  .logo-mark span:nth-child(4) { background: #e2231a; }
  .logo-name {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 1px;
  }
  h1 {
    font-size: 40px;
    font-weight: 800;
    margin-bottom: 16px;
  }
  p {
    font-size: 20px;
    color: #bdbdbd;
  }
</style>
</head>
<body>
  <div class="logo">
    <div class="logo-mark"><span></span><span></span><span></span><span></span></div>
    <div class="logo-name">AJG BLOCKS</div>
  </div>
  <h1>Downloads</h1>
  <p>Downloads soon</p>
</body>
</html>
